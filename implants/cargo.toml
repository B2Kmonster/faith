[package]
name = "academic-phantom"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.21"
flate2 = "1.0"
walkdir = "2.4"
sysinfo = "0.29"
whoami = "1.4"
winreg = "0.50"
windows = { version = "0.48", features = [
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus"
]}

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1